plugins {
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.0' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.0.21' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.0.21' apply false
    id 'nu.studer.jooq' version '9.0' apply false
}

group = 'tech.eflink'
version = '0.0.1-SNAPSHOT'

allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/public' }
        mavenCentral()
    }
}

// 所有子项目统一走 Spring Boot BOM 管理依赖版本
subprojects {
    apply plugin: 'io.spring.dependency-management'

    // MySQL 8.4 支持要求 Flyway >= 11.13.3；Spring Boot 3.3.5 BOM 默认 10.10.0，只认到 MySQL 8.1
    // 会在启动日志打印 "MySQL 8.4 is newer than this version of Flyway" 警告
    ext['flyway.version'] = '11.20.3'

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }
}
